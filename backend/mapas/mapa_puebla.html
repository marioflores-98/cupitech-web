ura": "Altura Km 02+300", "sentido": "Sentido Autopista Puebla - Orizaba", "limite": "70", "marca": "ADAPTATIVE RECOGNITION", "alimentacion": "Transformador de distribución"}, {"nombre": "UT566", "lat": 18.81948, "lon": -98.62873, "proyecto": "PUEBLA", "color": "#E74C3C", "vialidad": "Autopista Siglo XXI", "altura": "Altura Km 31+800", "sentido": "Sentido Morelos", "limite": "110", "marca": "ADAPTATIVE RECOGNITION", "alimentacion": "Panel Solar"}, {"nombre": "UT567", "lat": 18.81948, "lon": -98.62873, "proyecto": "PUEBLA", "color": "#E74C3C", "vialidad": "Autopista Siglo XXI", "altura": "Altura Km 31+800", "sentido": "Sentido Puebla", "limite": "110", "marca": "ADAPTATIVE RECOGNITION", "alimentacion": "Panel Solar"}, {"nombre": "UT568", "lat": 19.14669, "lon": -98.39022, "proyecto": "PUEBLA", "color": "#E74C3C", "vialidad": "Blvd. Huejotzingo - Cholula", "altura": "Altura Parque Industrial Área 4", "sentido": "Sentido Puebla", "limite": "70", "marca": "ADAPTATIVE RECOGNITION", "alimentacion": "Transformador de distribución"}, {"nombre": "UT569", "lat": 18.93015, "lon": -98.47581, "proyecto": "PUEBLA", "color": "#E74C3C", "vialidad": "Autopista Siglo XXI", "altura": "Altura Km 09+900", "sentido": "Sentido Puebla", "limite": "110", "marca": "ADAPTATIVE RECOGNITION", "alimentacion": "Panel Solar"}, {"nombre": "UT570", "lat": 18.989668, "lon": -97.907391, "proyecto": "PUEBLA", "color": "#E74C3C", "vialidad": "Acceso Tepeaca - Autopista", "altura": "Altura km 0+500", "sentido": "Sentido Tepeaca", "limite": "70", "marca": "ADAPTATIVE RECOGNITION", "alimentacion": "Transformador de distribución"}];
const COLOR = '#E74C3C';

const lats = puntos.map(p => p.lat);
const lons = puntos.map(p => p.lon);
const centerLat = (Math.min(...lats) + Math.max(...lats)) / 2;
const centerLon = (Math.min(...lons) + Math.max(...lons)) / 2;

const map = L.map('map', { center: [centerLat, centerLon], zoom: 11, zoomControl: true });
L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 18 }).addTo(map);

function crearIcono(solar = false, size = 10) {
  const bg = solar ? '#f59e0b' : COLOR;
  return L.divIcon({ className: '', html: `<div style="width:${size}px;height:${size}px;background:${bg};border:2px solid rgba(255,255,255,0.9);border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,0.6);"></div>`, iconSize: [size, size], iconAnchor: [size/2, size/2], popupAnchor: [0, -size] });
}

const markers = [];
const listaEl = document.getElementById('lista');

puntos.forEach((p, i) => {
  const esSolar = p.alimentacion && p.alimentacion.toLowerCase().includes('solar');
  const marker = L.marker([p.lat, p.lon], { icon: crearIcono(esSolar) });
  
  marker.bindPopup(`
    <div class="popup-title">📷 ${p.nombre}</div>
    ${p.vialidad ? `<div class="popup-row"><span class="popup-label">Vialidad</span><span class="popup-value">${p.vialidad}</span></div>` : ''}
    ${p.altura ? `<div class="popup-row"><span class="popup-label">Ubicación</span><span class="popup-value">${p.altura}</span></div>` : ''}
    ${p.sentido ? `<div class="popup-row"><span class="popup-label">Sentido</span><span class="popup-value">${p.sentido}</span></div>` : ''}
    ${p.limite ? `<div class="popup-row"><span class="popup-label">Límite</span><span class="popup-value">${p.limite} km/h</span></div>` : ''}
    <div class="popup-row"><span class="popup-label">Coordenadas</span><span class="popup-value" style="font-family:monospace;font-size:11px;">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</span></div>
    ${p.alimentacion ? `<div class="popup-badge ${esSolar ? 'solar' : ''}">${esSolar ? '☀️' : '⚡'} ${p.alimentacion}</div>` : ''}
  `, { maxWidth: 300 });

  marker.addTo(map);
  marker.idx = i;
  markers.push(marker);

  // Item en lista lateral
  const item = document.createElement('div');
  item.className = 'lista-item';
  item.dataset.idx = i;
  item.dataset.nombre = p.nombre.toLowerCase();
  item.dataset.via = (p.vialidad || '').toLowerCase();
  item.innerHTML = `
    <div class="lista-dot ${esSolar ? 'lista-solar' : ''}"></div>
    <div>
      <div class="lista-nombre">${p.nombre}</div>
      <div class="lista-via">${p.vialidad || ''} ${p.altura ? '— ' + p.altura : ''}</div>
    </div>`;
  item.addEventListener('click', () => {
    document.querySelectorAll('.lista-item').forEach(el => el.classList.remove('activo'));
    item.classList.add('activo');
    map.setView([p.lat, p.lon], 17);
    marker.openPopup();
  });
  listaEl.appendChild(item);
});

function buscar(q) {
  const query = q.toLowerCase().trim();
  let visibles = 0;
  document.querySelectorAll('.lista-item').forEach(item => {
    const idx = parseInt(item.dataset.idx);
    const coincide = !query || item.dataset.nombre.includes(query) || item.dataset.via.includes(query);
    item.style.display = coincide ? '' : 'none';
    if (coincide) {
      map.addLayer(markers[idx]);
      visibles++;
    } else {
      map.removeLayer(markers[idx]);
    }
  });
  document.getElementById('contador').textContent = visibles + ' cámaras';
  document.getElementById('no-results').style.display = visibles === 0 ? '' : 'none';
  
  // Si hay resultado exacto, centrar el mapa
  if (query.length >= 3) {
    const exacto = document.querySelector(`.lista-item[data-nombre="${query}"]`);
    if (exacto) {
      const idx = parseInt(exacto.dataset.idx);
      const p = puntos[idx];
      map.setView([p.lat, p.lon], 17);
      markers[idx].openPopup();
    }
  }
}
</script>
