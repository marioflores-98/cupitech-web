L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
const markers=[];
const listaEl=document.getElementById('lista');
const porTipo={};
TIPO_ORDER.forEach(t=>porTipo[t]={});
PUNTOS.forEach((p,i)=>{
  if(!porTipo[p.tipo])porTipo[p.tipo]={};
  if(!porTipo[p.tipo][p.grupo_key])porTipo[p.tipo][p.grupo_key]=[];
  porTipo[p.tipo][p.grupo_key].push({...p,idx:i});
  const bc=p.border_color;
  let marker=null;
  if(p.lat&&p.lon){
    marker=L.marker([p.lat,p.lon],{icon:crearIcono(p)});
    const alerta=p.impacto>1
      ?`<div class="pp-alert" style="background:${bc}20;border:1px solid ${bc}60;color:#f1f5f9">⚠️ <strong>${p.impacto} cámaras</strong> comparten <strong>${p.grupo_label}</strong> — falla única de campo.</div>`
      :`<div class="pp-alert" style="background:#14532D20;border:1px solid #22C55E40;color:#86EFAC">✅ Módem individual.</div>`;
    marker.bindPopup(`
      <div class="pp-title">📷 ${p.ut} <span class="pp-grp" style="background:${bc}">${p.grupo_label}</span></div>
      ${p.vialidad?`<div class="pp-row"><span class="pp-lbl">Vialidad</span><span class="pp-val">${p.vialidad}</span></div>`:''}
      ${p.altura?`<div class="pp-row"><span class="pp-lbl">Altura</span><span class="pp-val">${p.altura}</span></div>`:''}
      ${p.sentido?`<div class="pp-row"><span class="pp-lbl">Sentido</span><span class="pp-val">${p.sentido}</span></div>`:''}
      ${p.enlace?`<div class="pp-row"><span class="pp-lbl">Enlace</span><a class="pp-link" href="${p.enlace}" target="_blank">${p.enlace}</a></div>`:''}
      ${p.ip?`<div class="pp-row"><span class="pp-lbl">IP Cámara</span><span class="pp-val">${p.ip}</span></div>`:''}
      ${p.red_telcel?`<div class="pp-row"><span class="pp-lbl">Red 4G</span><span class="pp-val">${p.red_telcel}</span></div>`:''}
      ${p.wifi?`<div class="pp-row"><span class="pp-lbl">Contraseña</span><span class="pp-val">${p.wifi}</span></div>`:''}
      ${p.modem_ssid&&p.tipo==='Fibra'?`<div class="pp-row"><span class="pp-lbl">Módem</span><span class="pp-val">${p.modem_ssid}</span></div>`:''}
      ${p.tv_id?`<div class="pp-row"><span class="pp-lbl">TeamViewer</span><span class="pp-val">${p.tv_id} / ${p.tv_pass}</span></div>`:''}
      <div class="pp-row"><span class="pp-lbl">Coordenadas</span><span class="pp-val">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</span></div>
      ${alerta}
    `,{maxWidth:310});
    marker.addTo(map);
  }
  markers.push({marker,p,idx:i});
});
function buildLista(query=''){
  listaEl.innerHTML='';
  let totalVis=0;
  TIPO_ORDER.forEach(tipo=>{
    const grupos=porTipo[tipo];
    if(!grupos||Object.keys(grupos).length===0)return;
    const gruposVis={};
    Object.entries(grupos).forEach(([gkey,uts])=>{
      const utsVis=query?uts.filter(p=>p.ut.toLowerCase().includes(query)||(p.vialidad||'').toLowerCase().includes(query)||p.grupo_label.toLowerCase().includes(query)):uts;
      if(utsVis.length>0)gruposVis[gkey]=utsVis;
    });
    if(Object.keys(gruposVis).length===0)return;
    const secEl=document.createElement('div');
    secEl.className='sec-tipo';
    const totalTipo=Object.values(gruposVis).reduce((a,v)=>a+v.length,0);
    secEl.innerHTML=`<span>${TIPOS[tipo]||tipo} <span style="color:#475569;font-weight:400">(${totalTipo})</span></span><span class="sec-arrow">▾</span>`;
    let secCollapsed=false;
    const secContent=document.createElement('div');
    secEl.addEventListener('click',()=>{secCollapsed=!secCollapsed;secContent.style.display=secCollapsed?'none':'';secEl.querySelector('.sec-arrow').classList.toggle('collapsed',secCollapsed);});
    listaEl.appendChild(secEl);listaEl.appendChild(secContent);
    Object.entries(gruposVis).sort(([,a],[,b])=>b.length-a.length).forEach(([gkey,uts])=>{
      const bc=uts[0].border_color;const glabel=uts[0].grupo_label;
      const grpEl=document.createElement('div');grpEl.className='grp-header';
      let grpCollapsed=false;
      grpEl.innerHTML=`<div class="grp-dot" style="border:2px solid ${bc}"></div><span class="grp-name" style="color:${bc}">${glabel}</span><span class="grp-count" style="background:${bc}">${uts.length}</span><span class="grp-arrow">▾</span>`;
      const grpContent=document.createElement('div');
      grpEl.addEventListener('click',e=>{e.stopPropagation();grpCollapsed=!grpCollapsed;grpContent.style.display=grpCollapsed?'none':'';grpEl.querySelector('.grp-arrow').classList.toggle('collapsed',grpCollapsed);
        if(!grpCollapsed){const lats=uts.filter(p=>p.lat).map(p=>p.lat);const lons=uts.filter(p=>p.lon).map(p=>p.lon);
          if(lats.length>1)map.fitBounds([[Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]],{padding:[40,40]});
          else if(lats.length===1)map.setView([lats[0],lons[0]],15);}});
      secContent.appendChild(grpEl);secContent.appendChild(grpContent);
      uts.forEach(p=>{
        const item=document.createElement('div');item.className='ut-item';item.dataset.idx=p.idx;
        item.innerHTML=`<div class="ut-dot" style="border:2px solid ${bc}"></div><div class="ut-info"><div class="ut-nombre">${p.ut}</div><div class="ut-via">${p.vialidad||''}${p.altura?' — '+p.altura:''}</div></div>`;
        item.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.ut-item').forEach(el=>el.classList.remove('active'));item.classList.add('active');
          if(p.lat&&p.lon){map.setView([p.lat,p.lon],17);markers[p.idx].marker&&markers[p.idx].marker.openPopup();}});
        grpContent.appendChild(item);totalVis++;
      });
    });
  });
  document.getElementById('contador').textContent=totalVis+' cámaras';
  PUNTOS.forEach((p,i)=>{const m=markers[i].marker;if(!m)return;
    const visible=!query||p.ut.toLowerCase().includes(query)||(p.vialidad||'').toLowerCase().includes(query)||p.grupo_label.toLowerCase().includes(query);
    visible?map.addLayer(m):map.removeLayer(m);});
}
function buscar(q){buildLista(q.toLowerCase().trim());}
buildLista();
</script>
